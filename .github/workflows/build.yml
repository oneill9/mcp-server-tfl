name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: node/package-lock.json

      - run: cd node && npm ci && npm run build && npm test

      - name: Pack and smoke-test the npm distribution
        working-directory: node
        run: npm run test:package
