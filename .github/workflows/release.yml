name: Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: gradle
    - name: Build with Gradle
      run: ./gradlew build

  publish-docker:
    needs: test
    runs-on: ubuntu-latest
    # Only push Docker image if making changes to main or pushing a tag
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  github-release:
    needs: test
    runs-on: ubuntu-latest
    # Only create a release for tags that start with v
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle
      
      - name: Build distributions
        run: ./gradlew distZip
        
      - name: Release Note Generation
        id: generate-notes
        run: |
          cat > release_notes.md << 'EOF'
          ## Transport for London (TfL) MCP Server

          Provides real-time London transport data via the [Model Context Protocol](https://modelcontextprotocol.io/), making it accessible to AI assistants such as Claude.

          ### Tools

          | Tool | Description |
          |---|---|
          | `line_status` | Current status of one or more lines |
          | `arrivals` | Live arrivals at a stop |
          | `stop_search` | Search for stops by name |
          | `disruptions` | Current disruptions by transport mode |
          | `journey` | Plan a journey between two points |
          | `bike_points` | List Santander Cycles docking stations |
          | `list_modes` | List all valid TfL transport modes |
          | `air_quality` | Current London air quality data |
          | `road_disruptions` | Disrupted streets and A-roads |

          ### Installation

          #### Docker (recommended)

          Add to your Claude Desktop `claude_desktop_config.json`:

          ```json
          "tfl": {
            "command": "docker",
            "args": ["run", "-i", "--rm", "ghcr.io/${{ github.repository }}:${{ github.ref_name }}"]
          }
          ```

          #### Java (from ZIP)

          Download the ZIP below, extract it, and add to your Claude Desktop config:

          ```json
          "tfl": {
            "command": "/path/to/mcp-server-tfl/bin/mcp-server-tfl"
          }
          ```

          An optional TfL API key can be passed via the `TFL_APP_KEY` environment variable to raise rate limits. Register at [api-portal.tfl.gov.uk](https://api-portal.tfl.gov.uk/).
          EOF
          
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          files: build/distributions/*.zip
