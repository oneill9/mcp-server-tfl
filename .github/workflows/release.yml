name: Release

on:
  push:
    tags: [ "v*" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: node/package-lock.json

      - name: Verify committed release versions match the tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node --input-type=module - "$VERSION" <<'NODE'
          import { readFileSync } from "node:fs";

          const expected = process.argv[2];
          const readJson = (path) => JSON.parse(readFileSync(path, "utf8"));
          const packageJson = readJson("node/package.json");
          const lock = readJson("node/package-lock.json");
          const manifest = readJson("node/manifest.json");
          const registry = readJson("server.json");
          const plugin = readJson("codex-plugin/.codex-plugin/plugin.json");
          const source = readFileSync("node/src/index.ts", "utf8");

          const versions = new Map([
            ["node/package.json", packageJson.version],
            ["node/package-lock.json", lock.version],
            ["node/package-lock.json root package", lock.packages?.[""]?.version],
            ["node/manifest.json", manifest.version],
            ["server.json", registry.version],
            ["Codex plugin manifest", plugin.version],
          ]);
          for (const [sourceName, actual] of versions) {
            if (actual !== expected) {
              throw new Error(`${sourceName} has ${actual}; expected ${expected}`);
            }
          }
          if (registry.packages?.[0]?.identifier !== `ghcr.io/${process.env.GITHUB_REPOSITORY}:${expected}`) {
            throw new Error("server.json OCI identifier does not match the release tag");
          }
          if (!source.includes(`version: "${expected}"`) || !source.includes(`Server v${expected}`)) {
            throw new Error("node/src/index.ts does not report the release tag version");
          }
          if ("@modelcontextprotocol/sdk" in (packageJson.dependencies ?? {})) {
            throw new Error("Production dependencies must not include the v1 monolithic MCP SDK");
          }
          NODE

      - name: Install dependencies
        working-directory: node
        run: npm ci

      - name: Build and run unit, HTTP, and MCP conformance tests
        working-directory: node
        run: npm run build && npm test && npm run test:package && npm run test:conformance

      - name: Run live TfL contract tests
        working-directory: node
        run: npm run contractTest
        env:
          TFL_APP_KEY: ${{ secrets.TFL_APP_KEY }}

  build-mcpb:
    needs: release-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: node/package-lock.json

      - name: Install mcpb CLI
        run: npm install -g @anthropic-ai/mcpb

      - name: Build and smoke-test MCPB bundle
        env:
          SKIP_DOCKER_SMOKE: 1
          SKIP_NPM_SMOKE: 1
        run: bash scripts/test-distributions.sh

      - name: Upload MCPB artifact
        uses: actions/upload-artifact@v7
        with:
          name: mcpb-bundle
          path: build/tfl-mcp-server.mcpb

  publish-docker:
    needs: release-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: node/package-lock.json

      - name: Install smoke-test dependencies
        run: cd node && npm ci

      - name: Build and smoke-test stdio and HTTP container modes
        env:
          SKIP_MCPB_SMOKE: 1
          SKIP_NPM_SMOKE: 1
          TFL_SMOKE_IMAGE: tfl-mcp-server:release-smoke
        run: bash scripts/test-distributions.sh

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  publish-npm:
    needs: release-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        working-directory: node
        run: npm ci

      - name: Publish public npm package with trusted publishing
        working-directory: node
        run: npm publish

  github-release:
    needs: [publish-docker, publish-npm, build-mcpb]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write  # Required for OIDC auth with MCP Registry
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-tags: true
          fetch-depth: 0

      - name: Download MCPB artifact
        uses: actions/download-artifact@v8
        with:
          name: mcpb-bundle
          path: mcpb-out

      - name: Cache mcp-publisher
        id: cache-mcp-publisher
        uses: actions/cache@v6
        with:
          path: ~/.local/bin/mcp-publisher
          key: mcp-publisher-${{ runner.os }}-${{ runner.arch }}

      - name: Install mcp-publisher
        if: steps.cache-mcp-publisher.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/bin
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz -C ~/.local/bin mcp-publisher

      - name: Build release notes
        run: |
          # Read the committed release notes (what changed in this version)
          if [ -f RELEASE_NOTES.md ]; then
            cat RELEASE_NOTES.md > release_notes.md
          else
            echo "No release notes provided." > release_notes.md
          fi
          echo "" >> release_notes.md
          # Append the static installation template
          cat >> release_notes.md << 'TEMPLATE'
          ---

          ## Transport for London (TfL) MCP Server

          Provides real-time London transport data via the [Model Context Protocol](https://modelcontextprotocol.io/), making it accessible to AI assistants such as Claude.

          ### Tools

          | Tool | Description |
          |---|---|
          | `service_status` | Current status and disruptions by mode |
          | `arrivals` | Live arrivals at a stop by name |
          | `journey` | Plan a journey between two points |
          | `bike_points` | List Santander Cycles docking stations |
          | `crowding` | Live station crowding level by name |
          | `fares` | Fare information between two named stops |

          ### Installation

          #### Claude Desktop — MCPB extension (recommended)

          Download `tfl-mcp-server.mcpb` from the assets below and double-click to install it directly in Claude Desktop.

          #### npm

          Run the modern stdio server with Node.js 22 or later:

          ```shell
          npx -y @oneill9/tfl-mcp-server@VERSION
          ```

          #### Docker

          ```json
          {
            "mcpServers": {
              "tfl": {
                "command": "docker",
                "args": ["run", "-i", "--rm", "ghcr.io/REPO:TAG"]
              }
            }
          }
          ```

          The image starts the stdio transport by default. To run Streamable HTTP on port 8080 instead:

          ```shell
          docker run --rm -p 8080:8080 ghcr.io/REPO:TAG --http
          ```

          ### API Key

          A TfL API key is **strongly recommended** — without one, strict rate limits will impact most real-world usage. Pass it via the `TFL_APP_KEY` environment variable. [Register free at api-portal.tfl.gov.uk](https://api-portal.tfl.gov.uk/).
          TEMPLATE
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s|ghcr.io/REPO:TAG|ghcr.io/${{ github.repository }}:$VERSION|g" release_notes.md
          sed -i "s|@oneill9/tfl-mcp-server@VERSION|@oneill9/tfl-mcp-server@$VERSION|g" release_notes.md

      - name: Publish to MCP Registry
        run: |
          ~/.local/bin/mcp-publisher login github-oidc
          ~/.local/bin/mcp-publisher publish

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release_notes.md
          files: |
            mcpb-out/tfl-mcp-server.mcpb
