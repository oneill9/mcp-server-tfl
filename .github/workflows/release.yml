name: Release

on:
  push:
    tags: [ "v*" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: gradle
    - name: Build with Gradle
      run: ./gradlew build

  test-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: node/package-lock.json
      - run: cd node && npm ci && npm run build && npm test

  build-mcpb:
    needs: test-node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: node/package-lock.json

      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd node
          npm version "$VERSION" --allow-same-version --no-git-tag-version
          jq --arg v "$VERSION" '.version = $v' manifest.json > manifest.json.tmp && mv manifest.json.tmp manifest.json
          sed -i "s/version: \"[^\"]*\"/version: \"$VERSION\"/g" src/index.ts
          sed -i "s/Server v[0-9]*\.[0-9]*\.[0-9]*/Server v$VERSION/g" src/index.ts

      - name: Build Node server
        run: cd node && npm ci && npm run build

      - name: Install mcpb CLI
        run: npm install -g @anthropic-ai/mcpb

      - name: Pack MCPB bundle
        run: cd node && mcpb pack && mv node.mcpb tfl.mcpb

      - name: Upload MCPB artifact
        uses: actions/upload-artifact@v7
        with:
          name: mcpb-bundle
          path: node/tfl.mcpb

  publish-docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  github-release:
    needs: [test, publish-docker, build-mcpb]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write  # Required for OIDC auth with MCP Registry
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-tags: true
          fetch-depth: 0

      - name: Download MCPB artifact
        uses: actions/download-artifact@v8
        with:
          name: mcpb-bundle
          path: mcpb-out
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      - name: Cache mcp-publisher
        id: cache-mcp-publisher
        uses: actions/cache@v6
        with:
          path: ~/.local/bin/mcp-publisher
          key: mcp-publisher-${{ runner.os }}-${{ runner.arch }}

      - name: Install mcp-publisher
        if: steps.cache-mcp-publisher.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/bin
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz -C ~/.local/bin mcp-publisher

      - name: Build distributions
        run: ./gradlew distZip -Pversion="${GITHUB_REF_NAME#v}"

      - name: Build release notes
        run: |
          # Read the committed release notes (what changed in this version)
          if [ -f RELEASE_NOTES.md ]; then
            cat RELEASE_NOTES.md > release_notes.md
          else
            echo "No release notes provided." > release_notes.md
          fi
          echo "" >> release_notes.md
          # Append the static installation template
          cat >> release_notes.md << 'TEMPLATE'
          ---

          ## Transport for London (TfL) MCP Server

          Provides real-time London transport data via the [Model Context Protocol](https://modelcontextprotocol.io/), making it accessible to AI assistants such as Claude.

          ### Tools

          | Tool | Description |
          |---|---|
          | `service_status` | Current status and disruptions by mode |
          | `arrivals` | Live arrivals at a stop by name |
          | `journey` | Plan a journey between two points |
          | `bike_points` | List Santander Cycles docking stations |
          | `crowding` | Live station crowding level by name |
          | `fares` | Fare information between two named stops |

          ### Installation

          #### Claude Desktop — MCPB extension (recommended)

          Download `tfl.mcpb` from the assets below and double-click to install it directly in Claude Desktop.

          Or add manually to your `claude_desktop_config.json` (macOS: `~/Library/Application Support/Claude/`, Windows: `%APPDATA%\Claude\`, Linux: `~/.config/Claude/`):

          ```json
          {
            "mcpServers": {
              "tfl": {
                "command": "npx",
                "args": ["-y", "@oneill9/tfl-mcp-server"]
              }
            }
          }
          ```

          #### Docker

          ```json
          {
            "mcpServers": {
              "tfl": {
                "command": "docker",
                "args": ["run", "-i", "--rm", "ghcr.io/REPO:TAG"]
              }
            }
          }
          ```

          #### Java (from ZIP)

          Download the ZIP below, extract it, and add to your config:

          ```json
          {
            "mcpServers": {
              "tfl": {
                "command": "/path/to/tfl-mcp-server/bin/tfl-mcp-server"
              }
            }
          }
          ```

          ### API Key

          A TfL API key is **strongly recommended** — without one, strict rate limits will impact most real-world usage. Pass it via the `TFL_APP_KEY` environment variable. [Register free at api-portal.tfl.gov.uk](https://api-portal.tfl.gov.uk/).
          TEMPLATE
          # Replace REPO:TAG placeholder with actual values
          sed -i "s|ghcr.io/REPO:TAG|ghcr.io/${{ github.repository }}:${{ github.ref_name }}|g" release_notes.md

      - name: Update versions across repo
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          jq --arg v "$VERSION" \
             --arg img "ghcr.io/${{ github.repository }}:$VERSION" \
             '.version = $v | .packages[0].identifier = $img' \
             server.json > server.json.tmp && mv server.json.tmp server.json
          sed -i "s/^version=.*/version=$VERSION/" gradle.properties
          cd node
          npm version "$VERSION" --allow-same-version --no-git-tag-version
          jq --arg v "$VERSION" '.version = $v' manifest.json > manifest.json.tmp && mv manifest.json.tmp manifest.json
          sed -i "s/version: \"[^\"]*\"/version: \"$VERSION\"/g" src/index.ts
          sed -i "s/Server v[0-9]*\.[0-9]*\.[0-9]*/Server v$VERSION/g" src/index.ts
          cd ..

      - name: Commit version bumps back to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          git add server.json gradle.properties node/package.json node/package-lock.json node/manifest.json node/src/index.ts
          if git diff --cached --quiet; then
            echo "Versions already up to date"
          else
            git commit -m "chore: bump versions to ${GITHUB_REF_NAME#v}"
            git push origin main
          fi

      - name: Publish to MCP Registry
        run: |
          ~/.local/bin/mcp-publisher login github-oidc
          ~/.local/bin/mcp-publisher publish

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release_notes.md
          files: |
            build/distributions/*.zip
            mcpb-out/tfl.mcpb
