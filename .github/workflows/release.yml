name: Release

on:
  push:
    tags: [ "v*" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: gradle
    - name: Build with Gradle
      run: ./gradlew build

  test-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: node/package-lock.json
      - run: cd node && npm ci && npm run build && npm test

  build-mcpb:
    needs: test-node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: node/package-lock.json

      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd node
          npm version "$VERSION" --no-git-tag-version
          jq --arg v "$VERSION" '.version = $v' manifest.json > manifest.json.tmp && mv manifest.json.tmp manifest.json

      - name: Build Node server
        run: cd node && npm ci && npm run build

      - name: Install mcpb CLI
        run: npm install -g @anthropic-ai/mcpb

      - name: Pack MCPB bundle
        run: cd node && mcpb pack

      - name: Upload MCPB artifact
        uses: actions/upload-artifact@v7
        with:
          name: mcpb-bundle
          path: node/tfl.mcpb

  publish-docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  github-release:
    needs: [test, publish-docker, build-mcpb]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write  # Required for OIDC auth with MCP Registry
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-tags: true
          fetch-depth: 0

      - name: Download MCPB artifact
        uses: actions/download-artifact@v7
        with:
          name: mcpb-bundle
          path: mcpb-out
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      - name: Cache mcp-publisher
        id: cache-mcp-publisher
        uses: actions/cache@v5
        with:
          path: ~/.local/bin/mcp-publisher
          key: mcp-publisher-${{ runner.os }}-${{ runner.arch }}

      - name: Install mcp-publisher
        if: steps.cache-mcp-publisher.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/bin
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz -C ~/.local/bin mcp-publisher

      - name: Build distributions
        run: ./gradlew distZip -Pversion="${GITHUB_REF_NAME#v}"

      - name: Build release notes
        run: |
          # Read the committed release notes (what changed in this version)
          if [ -f RELEASE_NOTES.md ]; then
            cat RELEASE_NOTES.md > release_notes.md
          else
            echo "No release notes provided." > release_notes.md
          fi
          echo "" >> release_notes.md
          # Append the static installation template
          cat >> release_notes.md << 'TEMPLATE'
          ---

          ## Transport for London (TfL) MCP Server

          Provides real-time London transport data via the [Model Context Protocol](https://modelcontextprotocol.io/), making it accessible to AI assistants such as Claude.

          ### Tools

          | Tool | Description |
          |---|---|
          | `line_status` | Current status of one or more lines |
          | `arrivals` | Live arrivals at a stop |
          | `stop_search` | Search for stops by name |
          | `disruptions` | Current disruptions by transport mode |
          | `journey` | Plan a journey between two points |
          | `bike_points` | List Santander Cycles docking stations |
          | `list_modes` | List all valid TfL transport modes |
          | `air_quality` | Current London air quality data |
          | `road_disruptions` | Disrupted streets and A-roads |

          ### Installation

          #### Docker (recommended)

          Add to your Claude Desktop `claude_desktop_config.json` (macOS: `~/Library/Application Support/Claude/`, Windows: `%APPDATA%\Claude\`, Linux: `~/.config/Claude/`):

          ```json
          "tfl": {
            "command": "docker",
            "args": ["run", "-i", "--rm", "ghcr.io/REPO:TAG"]
          }
          ```

          #### Java (from ZIP)

          Download the ZIP below, extract it, and add to your Claude Desktop config:

          ```json
          "tfl": {
            "command": "/path/to/mcp-server-tfl/bin/mcp-server-tfl"
          }
          ```

          An optional TfL API key can be passed via the `TFL_APP_KEY` environment variable to raise rate limits. Register at [api-portal.tfl.gov.uk](https://api-portal.tfl.gov.uk/).
          TEMPLATE
          # Replace REPO:TAG placeholder with actual values
          sed -i "s|ghcr.io/REPO:TAG|ghcr.io/${{ github.repository }}:${{ github.ref_name }}|g" release_notes.md

      - name: Compute MCPB SHA-256
        id: mcpb-sha
        run: echo "sha256=$(sha256sum mcpb-out/tfl.mcpb | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Update server.json version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          MCPB_URL="https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/tfl.mcpb"
          jq --arg v "$VERSION" \
             --arg img "ghcr.io/${{ github.repository }}:$VERSION" \
             --arg mcpb "$MCPB_URL" \
             --arg sha "${{ steps.mcpb-sha.outputs.sha256 }}" \
             '.version = $v | .packages[0].identifier = $img | .packages[1].identifier = $mcpb | .packages[1].sha256 = $sha' \
             server.json > server.json.tmp && mv server.json.tmp server.json

      - name: Commit server.json back to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          git add server.json
          if git diff --cached --quiet; then
            echo "server.json already up to date"
          else
            git commit -m "chore: update server.json to ${GITHUB_REF_NAME#v}"
            git push origin main
          fi

      - name: Publish to MCP Registry
        run: |
          ~/.local/bin/mcp-publisher login github-oidc
          ~/.local/bin/mcp-publisher publish

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          files: |
            build/distributions/*.zip
            mcpb-out/tfl.mcpb
