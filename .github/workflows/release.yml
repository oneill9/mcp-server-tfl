name: Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: gradle
    - name: Build with Gradle
      run: ./gradlew build

  publish-docker:
    needs: test
    runs-on: ubuntu-latest
    # Only push Docker image if making changes to main or pushing a tag
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  github-release:
    needs: test
    runs-on: ubuntu-latest
    # Only create a release for tags that start with v
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle
      
      - name: Build distributions
        run: ./gradlew distZip
        
      - name: Release Note Generation
        id: generate-notes
        run: |
          echo "## Transport for London (TfL) MCP Server Release ${GITHUB_REF_NAME}" > release_notes.md
          echo "Provides real-time London transport data via Model Context Protocol." >> release_notes.md
          echo "" >> release_notes.md
          echo "### Installation via Docker" >> release_notes.md
          echo "\`\`\`json" >> release_notes.md
          echo "\"tfl\": {" >> release_notes.md
          echo "  \"command\": \"docker\"," >> release_notes.md
          echo "  \"args\": [\"run\", \"-i\", \"--rm\", \"${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest\"]" >> release_notes.md
          echo "}" >> release_notes.md
          echo "\`\`\`" >> release_notes.md
          
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          files: build/distributions/*.zip
