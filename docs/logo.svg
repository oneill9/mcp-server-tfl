<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="TfL MCP Server logo">
  <title>TfL MCP Server</title>
  <defs>
    <clipPath id="bg-clip">
      <rect x="4" y="4" width="192" height="192" rx="32" ry="32"/>
    </clipPath>
  </defs>

  <!-- Rounded square background -->
  <rect x="4" y="4" width="192" height="192" rx="32" ry="32" fill="#003688"/>

  <g clip-path="url(#bg-clip)">
    <!-- Horizontal tube line (Central line red #DC241F) -->
    <rect x="4" y="88" width="192" height="24" fill="#DC241F"/>

    <!-- Victoria line blue (#0098D4) — straight down from top, rounded bend, then diagonal to lower-right -->
    <path d="M 100,-10 L 100,100 Q 100,140 130,170 L 210,250"
          stroke="#0098D4" stroke-width="24" fill="none"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Station interchange circle at crossing point -->
  <circle cx="100" cy="100" r="22" fill="white"/>
  <circle cx="100" cy="100" r="14" fill="#003688"/>
</svg>
