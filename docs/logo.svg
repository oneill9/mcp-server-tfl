<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="TfL MCP Server logo">
  <title>TfL MCP Server</title>
  <!-- Rounded square background -->
  <rect x="4" y="4" width="192" height="192" rx="32" ry="32" fill="#003688"/>

  <!-- Horizontal tube line (red — Elizabeth/Central line colour) -->
  <rect x="4" y="88" width="192" height="24" fill="#DC241F"/>

  <!-- Vertical tube line (light blue — Victoria line colour) -->
  <rect x="88" y="4" width="24" height="192" fill="#009FE3"/>

  <!-- Station interchange circle at crossing point -->
  <circle cx="100" cy="100" r="22" fill="white"/>
  <circle cx="100" cy="100" r="14" fill="#003688"/>

  <!-- Corner: rounded rect clips the line ends visually -->
  <!-- Top-left label -->
  <text x="20" y="72"
        font-family="Arial Black, Arial, sans-serif"
        font-size="32" font-weight="900"
        fill="white" text-anchor="start"
        dominant-baseline="auto">TfL</text>

  <!-- Bottom-right label -->
  <text x="180" y="168"
        font-family="Arial, sans-serif"
        font-size="18" font-weight="bold"
        fill="white" text-anchor="end"
        dominant-baseline="auto">MCP</text>
</svg>
