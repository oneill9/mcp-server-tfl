[versions]
mcp = "1.1.2"
jetty = "12.1.9"
jackson = "2.21.3"
jackson3 = "3.1.3"
slf4j = "2.0.18"
log4j = "2.26.0"
junit = "6.0.3"
wiremock = "3.13.2"

[libraries]
mcp-sdk = { module = "io.modelcontextprotocol.sdk:mcp", version.ref = "mcp" }
jetty-server = { module = "org.eclipse.jetty:jetty-server", version.ref = "jetty" }
jetty-servlet = { module = "org.eclipse.jetty.ee10:jetty-ee10-servlet", version.ref = "jetty" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
jackson3-databind = { module = "tools.jackson.core:jackson-databind", version.ref = "jackson3" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
log4j-slf4j2-impl = { module = "org.apache.logging.log4j:log4j-slf4j2-impl", version.ref = "log4j" }
log4j-core = { module = "org.apache.logging.log4j:log4j-core", version.ref = "log4j" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
wiremock = { module = "org.wiremock:wiremock-jetty12", version.ref = "wiremock" }
