site_name: TfL MCP Server
site_description: An MCP server providing Transport for London real-time data to AI agents.
site_url: https://oneill9.github.io/tfl-mcp-server/

theme:
  name: material
  palette:
    scheme: default
    primary: indigo
    accent: deep orange
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top

repo_name: oneill9/tfl-mcp-server
repo_url: https://github.com/oneill9/tfl-mcp-server
edit_uri: edit/main/docs/

nav:
  - Welcome: index.md
  - Installation: installation.md
  - Tools Overview: tools.md
  - API Keys: api-keys.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
