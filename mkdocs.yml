site_name: TfL MCP Server
site_description: An MCP server providing Transport for London real-time data to AI agents.
site_url: https://oneill9.github.io/tfl-mcp-server/

exclude_docs: |
  /llms.md

hooks:
  - scripts/docs-hooks.py

theme:
  name: material
  custom_dir: overrides
  palette:
    scheme: default
    primary: indigo
    accent: deep orange
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top

repo_name: oneill9/tfl-mcp-server
repo_url: https://github.com/oneill9/tfl-mcp-server
edit_uri: edit/main/docs/

extra:
  analytics:
    provider: custom
    property: G-TZX1QK2613

nav:
  - Welcome: index.md
  - Installation: installation.md
  - Migrating to v2: migration-v2.md
  - Tools Overview: tools.md
  - API Keys: api-keys.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
