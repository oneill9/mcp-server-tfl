<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TfL Service Status</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f0f1a;
  --surface:#1a1a2e;
  --text:#e0e0e0;
  --text-muted:#8888aa;
  --good:#00c853;
  --disrupted:#ff6d00;
  --radius:10px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--text);
  padding:16px;
  min-height:100vh;
}
.board{
  max-width:540px;
  margin:0 auto;
}
h1{
  font-size:1.15rem;
  font-weight:600;
  letter-spacing:.02em;
  color:var(--text-muted);
  text-transform:uppercase;
  margin-bottom:12px;
}
.line-row{
  display:flex;
  align-items:stretch;
  background:var(--surface);
  border-radius:var(--radius);
  margin-bottom:8px;
  overflow:hidden;
  transition:transform .15s ease;
}
.line-row:hover{transform:scale(1.01)}
.line-name{
  min-width:120px;
  padding:12px 14px;
  font-weight:700;
  font-size:.88rem;
  background:var(--line-bg);
  color:var(--line-fg);
  display:flex;
  align-items:center;
}
.line-status{
  flex:1;
  padding:10px 14px;
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:6px;
}
.badge{
  display:inline-block;
  font-size:.78rem;
  font-weight:600;
  padding:3px 10px;
  border-radius:20px;
}
.badge.good{
  background:rgba(0,200,83,.15);
  color:var(--good);
}
.badge.disrupted{
  background:rgba(255,109,0,.15);
  color:var(--disrupted);
}
.reason{
  display:block;
  font-size:.72rem;
  color:var(--text-muted);
  margin-top:2px;
  line-height:1.35;
}
.empty{
  text-align:center;
  color:var(--text-muted);
  padding:32px 16px;
  font-size:.9rem;
}
</style>
</head>
<body data-app="service-status">
<div class="board">
<h1>Service Status</h1>
<div class="empty">Awaiting service status data...</div>
</div>
</body>
</html>
