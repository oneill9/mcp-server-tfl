<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TfL Service Status</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f0f1a;
  --surface:#1a1a2e;
  --text:#e0e0e0;
  --text-muted:#8888aa;
  --good:#00c853;
  --disrupted:#ff6d00;
  --radius:10px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--text);
  padding:16px;
  min-height:100vh;
}
.board{
  max-width:540px;
  margin:0 auto;
}
h1{
  font-size:1.15rem;
  font-weight:600;
  letter-spacing:.02em;
  color:var(--text-muted);
  text-transform:uppercase;
  margin-bottom:12px;
}
.line-row{
  display:flex;
  align-items:stretch;
  background:var(--surface);
  border-radius:var(--radius);
  margin-bottom:8px;
  overflow:hidden;
  transition:transform .15s ease;
}
.line-row:hover{transform:scale(1.01)}
.line-name{
  min-width:120px;
  padding:12px 14px;
  font-weight:700;
  font-size:.88rem;
  background:var(--line-bg);
  color:var(--line-fg);
  display:flex;
  align-items:center;
}
.line-status{
  flex:1;
  padding:10px 14px;
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:6px;
}
.badge{
  display:inline-block;
  font-size:.78rem;
  font-weight:600;
  padding:3px 10px;
  border-radius:20px;
}
.badge.good{
  background:rgba(0,200,83,.15);
  color:var(--good);
}
.badge.disrupted{
  background:rgba(255,109,0,.15);
  color:var(--disrupted);
}
.reason{
  display:block;
  font-size:.72rem;
  color:var(--text-muted);
  margin-top:2px;
  line-height:1.35;
}
.empty{
  text-align:center;
  color:var(--text-muted);
  padding:32px 16px;
  font-size:.9rem;
}
</style>
</head>
<body data-app="service-status">
<div class="board">
<h1>Service Status</h1>
<div class="empty" id="placeholder">Loading tube service status…</div>
</div>
<script type="module">
const LINE_COLORS = {
  "bakerloo":           { bg: "#B36305", fg: "#fff" },
  "central":            { bg: "#E32017", fg: "#fff" },
  "circle":             { bg: "#FFD300", fg: "#000" },
  "district":           { bg: "#00782A", fg: "#fff" },
  "hammersmith-city":   { bg: "#F3A9BB", fg: "#000" },
  "jubilee":            { bg: "#A0A5A9", fg: "#fff" },
  "metropolitan":       { bg: "#9B0056", fg: "#fff" },
  "northern":           { bg: "#000000", fg: "#fff" },
  "piccadilly":         { bg: "#003688", fg: "#fff" },
  "victoria":           { bg: "#0098D4", fg: "#fff" },
  "waterloo-city":      { bg: "#95CDBA", fg: "#000" },
  "elizabeth":          { bg: "#6950a1", fg: "#fff" },
  "london-overground":  { bg: "#EE7C0E", fg: "#fff" },
  "dlr":                { bg: "#00A4A7", fg: "#fff" },
};

function renderLines(lines) {
  const board = document.querySelector(".board");
  board.innerHTML = "<h1>Service Status</h1>" + lines.map(line => {
    const c = LINE_COLORS[line.id] ?? { bg: "#555555", fg: "#fff" };
    const statuses = line.statuses ?? [];
    const good = statuses.every(s => s.severity === "Good Service" || s.severity === "No Issues");
    const label = statuses.map(s => s.severity).join(", ") || "Unknown";
    const reason = statuses.flatMap(s => s.reason ? [s.reason] : []).join(" ");
    return `<div class="line-row" style="--line-bg:${c.bg};--line-fg:${c.fg}">
      <div class="line-name">${line.name}</div>
      <div class="line-status">
        <span class="badge ${good ? "good" : "disrupted"}">${label}</span>
        ${reason ? `<span class="reason">${reason}</span>` : ""}
      </div>
    </div>`;
  }).join("");
}

function handleResult(result) {
  const res = result?.content?.find(c => c.type === "resource");
  if (!res?.resource?.text) return;
  try {
    renderLines(JSON.parse(res.resource.text));
    hasRenderedResult = true;
    notifySizeChanged();
  } catch { /* ignore */ }
}

// Minimal MCP Apps postMessage client
let nextId = 1;
const pending = {};
let hasRenderedResult = false;

function send(msg) { window.parent.postMessage(msg, "*"); }

function notify(method, params = {}) {
  send({ jsonrpc: "2.0", method, params });
}

function request(method, params) {
  return new Promise((resolve, reject) => {
    const id = nextId++;
    pending[id] = { resolve, reject };
    send({ jsonrpc: "2.0", id, method, params });
  });
}

let lastSize = { width: 0, height: 0 };

function notifySizeChanged() {
  const body = document.body;
  const root = document.documentElement;
  const width = Math.ceil(Math.max(body.scrollWidth, root.scrollWidth, root.clientWidth));
  const height = Math.ceil(Math.max(body.scrollHeight, root.scrollHeight, root.clientHeight, 1));
  if (width === lastSize.width && height === lastSize.height) return;
  lastSize = { width, height };
  notify("ui/notifications/size-changed", { width, height });
}

window.addEventListener("message", event => {
  const msg = event.data;
  if (!msg || typeof msg !== "object") return;
  if (msg.id !== undefined && pending[msg.id]) {
    const h = pending[msg.id];
    delete pending[msg.id];
    msg.error ? h.reject(new Error(msg.error.message)) : h.resolve(msg.result);
    return;
  }
  if (msg.method === "ui/notifications/tool-result") handleResult(msg.params);
});

async function init() {
  try {
    await request("ui/initialize", {
      appInfo: { name: "TfL Service Status", version: "1.4.0" },
      appCapabilities: {},
      protocolVersion: "2026-01-26",
    });
    notify("ui/notifications/initialized");
    notifySizeChanged();
    if ("ResizeObserver" in window) {
      const observer = new ResizeObserver(notifySizeChanged);
      observer.observe(document.documentElement);
      observer.observe(document.body);
    }
    await new Promise(resolve => setTimeout(resolve, 150));
    if (hasRenderedResult) return;
    const result = await request("tools/call", {
      name: "service_status",
      arguments: { modes: "tube" },
    });
    if (result) handleResult(result);
  } catch (err) {
    document.getElementById("placeholder").textContent = "Failed to load: " + err.message;
  }
}

init();
</script>
</body>
</html>
